name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 回归测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package.json 和 package-lock.json 必须同步，否则 npm ci 直接拒绝
      # （手改 package.json 加依赖忘了更新 lock，就是这么翻车的）
      - name: 装依赖
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 装 Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: 全量回归
        run: node test/run-all.js

      - name: 冒烟测试（自己起临时实例）
        run: node scripts/doctor.js --self-test

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t presence-beacon:test .

      - name: 起服务
        run: |
          docker run -d --name pb \
            -p 8080:8080 \
            -e APP_ORIGIN=http://localhost:8080 \
            -e RP_ID=localhost \
            -e ADMIN_PASSWORD=ci-test-password \
            presence-beacon:test

      - name: 探活
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo ""
              echo "服务正常"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务 30 秒内没起来"
          docker logs pb
          exit 1

      - name: 清理
        if: always()
        run: docker rm -f pb || true
