services:
  presence-beacon:
    build: .
    image: presence-beacon:latest
    container_name: presence-beacon
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Docker 里数据必须落在挂载的卷上，否则容器一删就没了
      DB_FILE: /data/presence.db
      NODE_OPTIONS: "--disable-warning=ExperimentalWarning"
    volumes:
      - pb-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pb-data:
